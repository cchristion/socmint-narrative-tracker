[project]
name = "socmint-narrative-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.1",
    "imagehash>=4.3.2",
    "networkx>=3.7",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "plotly>=7.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scrapetube>=2.6.0",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]